<svg width="800" height="1200" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="1200" fill="#ffffff"/>
  <text x="400" y="50" font-family="Arial" font-size="36" text-anchor="middle" fill="#000000">Pixel's Board Game Night Kit</text>
  <text x="400" y="90" font-family="Arial" font-size="24" text-anchor="middle" fill="#000000">Printable Components</text>
  <rect x="100" y="150" width="600" height="400" fill="#f0f0f0" stroke="#000000" stroke-width="2"/>
  <text x="400" y="350" font-family="Arial" font-size="28" text-anchor="middle" fill="#000000">Game Board</text>
  <circle cx="200" cy="250" r="30" fill="#ff0000"/>
  <circle cx="400" cy="250" r="30" fill="#00ff00"/>
  <circle cx="600" cy="250" r="30" fill="#0000ff"/>
  <rect x="150" y="450" width="50" height="50" fill="#ffff00" stroke="#000000"/>
  <rect x="250" y="450" width="50" height="50" fill="#ffff00" stroke="#000000"/>
  <rect x="350" y="450" width="50" height="50" fill="#ffff00" stroke="#000000"/>
  <rect x="450" y="450" width="50" height="50" fill="#ffff00" stroke="#000000"/>
  <rect x="550" y="450" width="50" height="50" fill="#ffff00" stroke="#000000"/>
  <text x="400" y="600" font-family="Arial" font-size="24" text-anchor="middle" fill="#000000">Tokens and Dice</text>
  <polygon points="150,650 170,700 130,700" fill="#ff0000"/>
  <polygon points="250,650 270,700 230,700" fill="#00ff00"/>
  <polygon points="350,650 370,700 330,700" fill="#0000ff"/>
  <rect x="500" y="650" width="60" height="60" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="530" y="690" font-family="Arial" font-size="24" text-anchor="middle" fill="#000000">D6</text>
  <text x="400" y="750" font-family="Arial" font-size="24" text-anchor="middle" fill="#000000">Cards</text>
  <rect x="100" y="800" width="150" height="200" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="175" y="900" font-family="Arial" font-size="20" text-anchor="middle" fill="#000000">Action Card</text>
  <rect x="300" y="800" width="150" height="200" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="375" y="900" font-family="Arial" font-size="20" text-anchor="middle" fill="#000000">Event Card</text>
  <rect x="500" y="800" width="150" height="200" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <text x="575" y="900" font-family="Arial" font-size="20" text-anchor="middle" fill="#000000">Treasure Card</text>
  <text x="400" y="1050" font-family="Arial" font-size="24" text-anchor="middle" fill="#000000">Score Sheet</text>
  <rect x="100" y="1100" width="600" height="80" fill="#ffffff" stroke="#000000" stroke-width="2"/>
  <line x1="200" y1="1100" x2="200" y2="1180" stroke="#000000" stroke-width="2"/>
  <line x1="300" y1="1100" x2="300" y2="1180" stroke="#000000" stroke-width="2"/>
  <line x1="400" y1="1100" x2="400" y2="1180" stroke="#000000" stroke-width="2"/>
  <line x1="500" y1="1100" x2="500" y2="1180" stroke="#000000" stroke-width="2"/>
  <text x="150" y="1145" font-family="Arial" font-size="18" text-anchor="middle" fill="#000000">Player</text>
  <text x="250" y="1145" font-family="Arial" font-size="18" text-anchor="middle" fill="#000000">Score</text>
  <text x="350" y="1145" font-family="Arial" font-size="18" text-anchor="middle" fill="#000000">Round 1</text>
  <text x="450" y="1145" font-family="Arial" font-size="18" text-anchor="middle" fill="#000000">Round 2</text>
  <text x="550" y="1145" font-family="Arial" font-size="18" text-anchor="middle" fill="#000000">Total</text>
