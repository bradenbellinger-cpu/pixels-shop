<svg width="612" height="792" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><text x="50" y="60" font-family="Arial,sans-serif" font-size="28" fill="#1a1a2e" font-weight="bold">Board Game Night Kit — Cards</text><text x="50" y="110" font-family="Arial,sans-serif" font-size="16" fill="#333">Card 1: Move forward 2 spaces</text><text x="50" y="140" font-family="Arial,sans-serif" font-size="16" fill="#333">Card 2: Move back 1 space</text><text x="50" y="170" font-family="Arial,sans-serif" font-size="16" fill="#333">Card 3: Draw again</text><text x="50" y="200" font-family="Arial,sans-serif" font-size="16" fill="#333">Card 4: Skip a turn</text><text x="50" y="230" font-family="Arial,sans-serif" font-size="16" fill="#333">Card 5: Gain 5 points</text><text x="50" y="260" font-family="Arial,sans-serif" font-size="16" fill="#333">Card 6: Lose 3 points</text><text x="50" y="290" font-family="Arial,sans-serif" font-size="16" fill="#333">Card 7: Swap places with another player</text><text x="50" y="320" font-family="Arial,sans-serif" font-size="16" fill="#333">Card 8: Move to the start</text><line x1="50" y1="360" x2="562" y2="360" stroke="#1a1a2e" stroke-width="2"/><text x="50" y="400" font-family="Arial,sans-serif" font-size="14" fill="#666">Cut along dotted lines. Print on cardstock.</text></svg>