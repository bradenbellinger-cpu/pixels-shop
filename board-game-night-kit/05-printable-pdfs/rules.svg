<svg width="612" height="792" xmlns="http://www.w3.org/2000/svg"><rect width="100%" height="100%" fill="white"/><text x="50" y="60" font-family="Arial,sans-serif" font-size="28" fill="#1a1a2e" font-weight="bold">Board Game Night Kit — Rules</text><text x="50" y="110" font-family="Arial,sans-serif" font-size="16" fill="#333">Objective: Collect the most points by completing challenge cards.</text><text x="50" y="140" font-family="Arial,sans-serif" font-size="16" fill="#333">Players: 2–4 players</text><text x="50" y="170" font-family="Arial,sans-serif" font-size="16" fill="#333">Playtime: 30–45 minutes</text><text x="50" y="200" font-family="Arial,sans-serif" font-size="16" fill="#333">Setup: Shuffle the card deck. Place the board in the center.</text><text x="50" y="230" font-family="Arial,sans-serif" font-size="16" fill="#333">Turn: Draw a card, follow its instructions, move your token.</text><text x="50" y="260" font-family="Arial,sans-serif" font-size="16" fill="#333">Win: First player to reach the finish space with the most points wins.</text><line x1="50" y1="300" x2="562" y2="300" stroke="#1a1a2e" stroke-width="2"/><text x="50" y="340" font-family="Arial,sans-serif" font-size="14" fill="#666">Print on US Letter paper (8.5" x 11").</text></svg>