<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <style>
      .cell { stroke: #2b2b2b; stroke-width: 3; rx: 8; }
      .bg { fill: #1a1a24; }
      .title { font-family: sans-serif; font-weight: bold; font-size: 24px; fill: #ffffff; text-anchor: middle; }
      .cell-0-0 { fill: #ff6b6b; }
      .cell-0-1 { fill: #feca57; }
      .cell-0-2 { fill: #48dbfb; }
      .cell-0-3 { fill: #1dd1a1; }
      .cell-0-4 { fill: #ff9ff3; }
      
      .cell-1-0 { fill: #feca57; }
      .cell-1-1 { fill: #48dbfb; }
      .cell-1-2 { fill: #1dd1a1; }
      .cell-1-3 { fill: #ff9ff3; }
      .cell-1-4 { fill: #ff6b6b; }

      .cell-2-0 { fill: #48dbfb; }
      .cell-2-1 { fill: #1dd1a1; }
      .cell-2-2 { fill: #ff9ff3; }
      .cell-2-3 { fill: #ff6b6b; }
      .cell-2-4 { fill: #feca57; }

      .cell-3-0 { fill: #1dd1a1; }
      .cell-3-1 { fill: #ff9ff3; }
      .cell-3-2 { fill: #ff6b6b; }
      .cell-3-3 { fill: #feca57; }
      .cell-3-4 { fill: #48dbfb; }

      .cell-4-0 { fill: #ff9ff3; }
      .cell-4-1 { fill: #ff6b6b; }
      .cell-4-2 { fill: #feca57; }
      .cell-4-3 { fill: #48dbfb; }
      .cell-4-4 { fill: #1dd1a1; }
    </style>
  </defs>
  <rect width="500" height="500" class="bg" />
  <text x="250" y="35" class="title">Printable Board Game Night Kit</text>
  <g transform="translate(50, 60)">
    <!-- Row 0 -->
    <rect x="0" y="0" width="72" height="72" class="cell cell-0-0" />
    <rect x="82" y="0" width="72" height="72" class="cell cell-0-1" />
    <rect x="164" y="0" width="72" height="72" class="cell cell-0-2" />
    <rect x="246" y="0" width="72" height="72" class="cell cell-0-3" />
    <rect x="328" y="0" width="72" height="72" class="cell cell-0-4" />

    <!-- Row 1 -->
    <rect x="0" y="82" width="72" height="72" class="cell cell-1-0" />
    <rect x="82" y="82" width="72" height="72" class="cell cell-1-1" />
    <rect x="164" y="82" width="72" height="72" class="cell cell-1-2" />
    <rect x="246" y="82" width="72" height="72" class="cell cell-1-3" />
    <rect x="328" y="82" width="72" height="72" class="cell cell-1-4" />

    <!-- Row 2 -->
    <rect x="0" y="164" width="72" height="72" class="cell cell-2-0" />
    <rect x="82" y="164" width="72" height="72" class="cell cell-2-1" />
    <rect x="164" y="164" width="72" height="72" class="cell cell-2-2" />
    <rect x="246" y="164" width="72" height="72" class="cell cell-2-3" />
    <rect x="328" y="164" width="72" height="72" class="cell cell-2-4" />

    <!-- Row 3 -->
    <rect x="0" y="246" width="72" height="72" class="cell cell-3-0" />
    <rect x="82" y="246" width="72" height="72" class="cell cell-3-1" />
    <rect x="164" y="246" width="72" height="72" class="cell cell-3-2" />
    <rect x="246" y="246" width="72" height="72" class="cell cell-3-3" />
    <rect x="328" y="246" width="72" height="72" class="cell cell-3-4" />

    <!-- Row 4 -->
    <rect x="0" y="328" width="72" height="72" class="cell cell-4-0" />
    <rect x="82" y="328" width="72" height="72" class="cell cell-4-1" />
    <rect x="164" y="328" width="72" height="72" class="cell cell-4-2" />
    <rect x="246" y="328" width="72" height="72" class="cell cell-4-3" />
    <rect x="328" y="328" width="72" height="72" class="cell cell-4-4" />
  </g>
</svg>