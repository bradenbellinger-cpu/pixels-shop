<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0f0f0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />
  
  <!-- Decorative circles -->
  <circle cx="100" cy="100" r="60" fill="#ffffff" opacity="0.1" />
  <circle cx="700" cy="150" r="80" fill="#ffffff" opacity="0.1" />
  <circle cx="600" cy="500" r="70" fill="#ffffff" opacity="0.1" />
  <circle cx="150" cy="520" r="50" fill="#ffffff" opacity="0.1" />
  
  <!-- Main card -->
  <rect x="50" y="40" width="700" height="520" fill="url(#cardGrad)" stroke="#ffffff" stroke-width="3" rx="20" />
  
  <!-- Title -->
  <text x="400" y="100" font-family="Arial, sans-serif" font-size="42" font-weight="bold" fill="#4a4a4a" text-anchor="middle">Board Game Night Kit</text>
  <text x="400" y="135" font-family="Arial, sans-serif" font-size="18" fill="#666666" text-anchor="middle">Print-at-home fun for family &amp; friends</text>
  
  <!-- Game board -->
  <rect x="100" y="180" width="280" height="220" fill="#f8f9fa" stroke="#333333" stroke-width="2" rx="8" />
  <text x="240" y="200" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#4a4a4a" text-anchor="middle">GAME BOARD</text>
  <!-- Board grid -->
  <rect x="120" y="220" width="240" height="140" fill="none" stroke="#cccccc" stroke-width="1" />
  <line x1="120" y1="255" x2="360" y2="255" stroke="#cccccc" stroke-width="1" />
  <line x1="120" y1="290" x2="360" y2="290" stroke="#cccccc" stroke-width="1" />
  <line x1="140" y1="220" x2="140" y2="360" stroke="#cccccc" stroke-width="1" />
  <line x1="220" y1="220" x2="220" y2="360" stroke="#cccccc" stroke-width="1" />
  <line x1="300" y1="220" x2="300" y2="360" stroke="#cccccc" stroke-width="1" />
  <!-- Board spaces -->
  <circle cx="140" cy="255" r="6" fill="#ff6b6b" />
  <circle cx="220" cy="255" r="6" fill="#4ecdc4" />
  <circle cx="300" cy="255" r="6" fill="#45b7d1" />
  <circle cx="140" cy="290" r="6" fill="#ff6b6b" />
  <circle cx="220" cy="290" r="6" fill="#4ecdc4" />
  <circle cx="300" cy="290" r="6" fill="#45b7d1" />
  <circle cx="140" cy="325" r="6" fill="#ff6b6b" />
  <circle cx="220" cy="325" r="6" fill="#4ecdc4" />
  <circle cx="300" cy="325" r="6" fill="#45b7d1" />
  
  <!-- Dice -->
  <rect x="430" y="200" width="70" height="70" fill="#ffffff" stroke="#333333" stroke-width="2" rx="4" />
  <circle cx="450" cy="220" r="5" fill="#333333" />
  <circle cx="480" cy="250" r="5" fill="#333333" />
  <circle cx="450" cy="250" r="5" fill="#333333" />
  <circle cx="480" cy="220" r="5" fill="#333333" />
  <circle cx="465" cy="235" r="5" fill="#333333" />
  <rect x="430" y="280" width="70" height="70" fill="#ffffff" stroke="#333333" stroke-width="2" rx="4" />
  <circle cx="450" cy="300" r="5" fill="#333333" />
  <circle cx="480" cy="330" r="5" fill="#333333" />
  <circle cx="450" cy="330" r="5" fill="#333333" />
  <circle cx="480" cy="300" r="5" fill="#333333" />
  <circle cx="465" cy="315" r="5" fill="#333333" />
  <text x="465" y="365" font-family="Arial, sans-serif" font-size="14" fill="#4a4a4a" text-anchor="middle">DICE</text>
  
  <!-- Game pieces / meeples -->
  <rect x="520" y="200" width="20" height="40" fill="#ff6b6b" rx="4" />
  <rect x="520" y="200" width="20" height="10" fill="#ffffff" rx="2" />
  <rect x="550" y="210" width="20" height="30" fill="#4ecdc4" rx="4" />
  <rect x="550" y="210" width="20" height="8" fill="#ffffff" rx="2" />
  <rect x="580" y="220" width="20" height="20" fill="#45b7d1" rx="4" />
  <rect x="580" y="220" width="20" height="6" fill="#ffffff" rx="2" />
  <text x="550" y="260" font-family="Arial, sans-serif" font-size="14" fill="#4a4a4a" text-anchor="middle">MEEPLES</text>
  
  <!-- Cards -->
  <rect x="520" y="290" width="50" height="70" fill="#ffffff" stroke="#333333" stroke-width="2" rx="4" />
  <rect x="525" y="295" width="40" height="12" fill="#ff6b6b" rx="2" />
  <rect x="525" y="312" width="40" height="8" fill="#cccccc" rx="2" />
  <rect x="580" y="290" width="50" height="70" fill="#ffffff" stroke="#333333" stroke-width="2" rx="4" />
  <rect x="585" y="295" width="40" height="12" fill="#4ecdc4" rx="2" />
  <rect x="585" y="312" width="40" height="8" fill="#cccccc" rx="2" />
  <text x="550" y="375" font-family="Arial, sans-serif" font-size="14" fill="#4a4a4a" text-anchor="middle">CARDS</text>
  
  <!-- Feature badges -->
  <rect x="100" y="430" width="220" height="60" fill="#ffffff" opacity="0.9" rx="10" />
  <text x="115" y="455" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4a4a4a">✓ Printable PDF</text>
  <text x="115" y="475" font-family="Arial, sans-serif" font-size="14" fill="#4a4a4a">✓ All ages welcome</text>
  <rect x="340" y="430" width="220" height="60" fill="#ffffff" opacity="0.9" rx="10" />
  <text x="355" y="455" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4a4a4a">✓ Easy setup</text>
  <text x="355" y="475" font-family="Arial, sans-serif" font-size="14" fill="#4a4a4a">✓ Hours of fun</text>
  <rect x="580" y="430" width="170" height="60" fill="#ffffff" opacity="0.9" rx="10" />
  <text x="595" y="455" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#4a4a4a">✓ Free download</text>
  
  <!-- Footer -->
  <rect x="50" y="510" width="700" height="50" fill="#3a3a3a" rx="0 0 20 20" />
  <text x="400" y="535" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Pixel's Printable Board Game Night Kit</text>
  <text x="400" y="555" font-family="Arial, sans-serif" font-size="12" fill="#cccccc" text-anchor="middle">Print • Play • Enjoy • code PN8BJ</text>
</svg>